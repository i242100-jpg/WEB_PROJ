<style>.spread,.flash{transform-origin:249px 160px}.spread{animation:expand 2.8s both}.strike{transform-origin:204px 191px;animation:strike 1.6s both}.flash{animation:catch 1.6s both}.outline{animation:figure 2.2s both}@keyframes expand{0%,29%{transform:scale(0)}40%{transform:scale(.18)}45%{transform:scale(.13)}60%{transform:scale(1)}85%{transform:scale(6)}100%{transform:scale(22)}}@keyframes strike{0%,12%{opacity:0;transform:rotate(11deg)}22%{opacity:1;transform:rotate(9deg)}49%{opacity:1;transform:rotate(-5deg)}64%{transform:rotate(4deg)}100%{opacity:0}}@keyframes catch{0%,48%{opacity:0;transform:scale(.1)}57%{opacity:1;transform:scale(1.2)}72%{opacity:.3;transform:scale(.75)}100%{opacity:0;transform:scale(1.5)}}@keyframes figure{0%,8%,100%{opacity:0}25%,65%{opacity:.85}}</style>
